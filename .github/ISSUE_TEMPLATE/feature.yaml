name: Feature / Requirement
description: Describe a new feature, requirement, or technical improvement
labels:
  - enhancement

body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What kind of change is this?
      options:
        - Business requirement
        - Technical feature
        - Technical improvement
        - Refactoring / maintenance
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What capability or behavior should the system provide?
      placeholder: |
        Describe the feature or behavior from the user's or system's perspective.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature or requirement needed? What user, business, or technical need does it address?
      placeholder: |
        Explain the reason for introducing this behavior or capability.
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: What rules, constraints, or specific conditions must this feature satisfy?
      placeholder: |
        - The user must...
        - The system must...
        - The value must...
        - If ..., then ...
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What must be true for this issue to be considered complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: technical-notes
    attributes:
      label: Technical notes
      description: Optional implementation details, architectural considerations, or relevant components.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other relevant information, references, examples, or related issues.
    validations:
      required: false
