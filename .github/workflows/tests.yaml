name: Tests

on:
  push:
    branches:
      - trunk

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore

